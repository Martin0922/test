<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>My First Commander Deck · MTG Gallery</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--muted:#aab5c8;--line:#2b3650;--accent:#8ab4ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2a45 0,#0b1020 55%);color:#f5f7fb;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1200px;margin:auto;padding:28px 18px 16px}h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:0 0 6px}.sub{color:var(--muted);margin:0}
.toolbar{max-width:1200px;margin:0 auto;padding:0 18px 18px;display:flex;gap:10px;flex-wrap:wrap}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:white;padding:12px;font:inherit}
input{flex:1;min-width:210px}.stats{max-width:1200px;margin:0 auto;padding:0 18px 14px;color:var(--muted);font-size:.92rem}
.grid{max-width:1200px;margin:0 auto;padding:0 18px 36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px;cursor:pointer;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}.card img{display:block;width:100%;height:auto;border-radius:8px;background:#222;aspect-ratio:5/7;object-fit:cover}
.card .name{font-weight:650;font-size:.88rem;margin:8px 2px 2px;overflow-wrap:anywhere}.card .meta{font-size:.75rem;color:var(--muted);margin:0 2px 3px}
.notice{max-width:900px;margin:12px auto 24px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--muted)}
dialog{max-width:min(94vw,900px);max-height:92vh;border:1px solid var(--line);border-radius:16px;background:#111827;color:white;padding:16px}
dialog::backdrop{background:#000c}.detail{display:grid;grid-template-columns:minmax(180px,340px) minmax(220px,1fr);gap:18px;align-items:start}
.detail img{width:100%;border-radius:10px}.detail h2{margin:4px 0 8px}.detail p{white-space:pre-wrap;color:#d5dbea}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid var(--line);border-radius:10px;background:#263550;color:white;padding:9px 12px;font:inherit;cursor:pointer}
footer{padding:22px;text-align:center;color:var(--muted);font-size:.78rem}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{grid-template-columns:1fr 1fr;gap:12px}.detail h2{font-size:1.1rem}}
@media(max-width:420px){.detail{grid-template-columns:1fr}.detail img{max-width:230px;margin:auto}}
</style>
</head>
<body>
<header><h1>My First Commander Deck</h1><p class="sub">Anowon, the Ruin Thief · Dimir Rogue tribal</p></header>
<div class="toolbar">
  <input id="search" type="search" placeholder="Search cards by name…" aria-label="Search cards">
  <select id="sort" aria-label="Sort cards"><option value="name">Sort: Card name</option><option value="type">Sort: Card type</option></select>
</div>
<div class="stats" id="stats">Loading card images…</div>
<div class="notice" id="notice">Looking up the exact printings in Scryfall. The gallery will display card images when the lookup finishes.</div>
<main class="grid" id="grid"></main>
<dialog id="modal"><div class="detail"><img id="large" alt=""><div><h2 id="detailName"></h2><div id="detailMeta" class="meta"></div><p id="detailText"></p><div class="actions"><button id="flip" hidden>Show other face</button><button id="close">Close</button></div></div></div></dialog>
<footer>Card data and images are provided by Scryfall. Magic: The Gathering is © Wizards of the Coast.</footer>
<script>
const deck = [{"name": "Access Tunnel", "qty": 1, "set": "tdc", "collector": null}, {"name": "Anowon, the Ruin Thief", "qty": 1, "set": "znc", "collector": null}, {"name": "Aqueous Form", "qty": 1, "set": "cmr", "collector": null}, {"name": "Arcane Heist", "qty": 1, "set": "otc", "collector": null}, {"name": "Arcane Signet", "qty": 1, "set": "frc", "collector": null}, {"name": "Back in Town", "qty": 1, "set": "otc", "collector": null}, {"name": "Base Camp", "qty": 1, "set": "znr", "collector": null}, {"name": "Bident of Thassa", "qty": 1, "set": "blc", "collector": null}, {"name": "Blackbloom Rogue // Blackbloom Bog", "qty": 1, "set": "znr", "collector": null}, {"name": "Bojuka Bog", "qty": 1, "set": "soc", "collector": null}, {"name": "Boss Uramon, Shadow's Reach", "qty": 1, "set": "mbc", "collector": null}, {"name": "Butch DeLoria, Tunnel Snake", "qty": 1, "set": "pip", "collector": null}, {"name": "Castle Locthwain", "qty": 1, "set": "fdc", "collector": null}, {"name": "Castle Vantress", "qty": 1, "set": "dsc", "collector": null}, {"name": "Choked Estuary", "qty": 1, "set": "msc", "collector": null}, {"name": "Cloak of Mists", "qty": 1, "set": "plst", "collector": null}, {"name": "Command Tower", "qty": 1, "set": "frc", "collector": null}, {"name": "Commander's Sphere", "qty": 1, "set": "ecc", "collector": null}, {"name": "Consuming Aberration", "qty": 1, "set": "tdc", "collector": null}, {"name": "Crippling Fear", "qty": 1, "set": "cmm", "collector": null}, {"name": "Damnation", "qty": 1, "set": "2x2", "collector": null}, {"name": "Didn't Say Please", "qty": 1, "set": "eld", "collector": null}, {"name": "Dimir Aqueduct", "qty": 1, "set": "dsc", "collector": null}, {"name": "Double Down", "qty": 1, "set": "otj", "collector": null}, {"name": "Drown in the Loch", "qty": 1, "set": "clb", "collector": null}, {"name": "Drowned Catacomb", "qty": 1, "set": "frc", "collector": null}, {"name": "Faerie Mastermind", "qty": 1, "set": "soc", "collector": null}, {"name": "Feed : "j25", "collector": null}, {"name": "Reconnaissance Mission", "qty": 1, "set": "msc", "collector": null}, {"name": "Reliquary Tower", "qty": 1, "set": "soc", "collector": null}, {"name": "Rev, Tithe Extractor", "qty": 1, "set": "j25", "collector": null}, {"name": "Rhystic Study", "qty": 1, "set": "j22", "collector": null}, {"name": "Rise of the Dark Realms", "qty": 1, "set": "fic", "collector": null}, {"name": "Roaming Throne", "qty": 1, "set": "lci", "collector": null}, {"name": "Rogue's Passage", "qty": 1, "set": "hoc", "collector": null}, {"name": "Scavenger Grounds", "qty": 1, "set": "msc", "collector": null}, {"name": "Shipwreck Marsh", "qty": 1, "set": "fra", "collector": null}, {"name": "Shoreline Looter", "qty": 1, "set": "blb", "collector": null}, {"name": "Sink into Stupor // Soporific Springs", "qty": 1, "set": "mh3", "collector": null}, {"name": "Soaring Thought-Thief", "qty": 1, "set": "znr", "collector": null}, {"name": "Sol Ring", "qty": 1, "set": "frc", "collector": null}, {"name": "Soul Manipulation", "qty": 1, "set": "plst", "collector": null}, {"name": "Spinal Embrace", "qty": 1, "set": "dmr", "collector": null}, {"name": "Stinkdrinker Bandit", "qty": 1, "set": "znc", "collector": null}, {"name": "Sunken Hollow", "qty": 1, "set": "msc", "collector": null}, {"name": "Swamp", "qty": 5, "set": "mdd", "collector": "296"}, {"name": "Sygg, River Cutthroat", "qty": 1, "set": "plst", "collector": null}, {"name": "Tainted Isle", "qty": 1, "set": "dsc", "collector": null}, {"name": "Temple of the False God", "qty": 1, "set": "soc", "collector": null}, {"name": "Thada Adel, Acquisitor", "qty": 1, "set": "wwk", "collector": null}, {"name": "The Water Crystal", "qty": 1, "set": "fin", "collector": null}, {"name": "Thieves' Guild Enforcer", "qty": 1, "set": "j25", "collector": null}, {"name": "Thought Collapse", "qty": 1, "set": "plst", "collector": null}, {"name": "Thought Vessel", "qty": 1, "set": "msc", "collector": null}, {"name": "Tinybones, the Pickpocket", "qty": 1, "set": "otj", "collector": null}, {"name": "Toxic Deluge", "qty": 1, "set": "msc", "collector": null}, {"name": "Trepanation Blade", "qty": 1, "set": "plst", "collector": null}, {"name": "Waterlogged Teachings // Inundated Archive", "qty": 1, "set": "mh3", "collector": null}, {"name": "Watery Grave", "qty": 1, "set": "trk", "collector": null}, {"name": "Whispersteel Dagger", "qty": 1, "set": "plst", "collector": null}, {"name": "Withering Torment", "qty": 1, "set": "msc", "collector": null}, {"name": "Zareth San, the Trickster", "qty": 1, "set": "znr", "collector": null}];
const commander = "Anowon, the Ruin Thief";
const grid=document.getElementById("grid"), stats=document.getElementById("stats"), notice=document.getElementById("notice");
const search=document.getElementById("search"), sort=document.getElementById("sort");
const modal=document.getElementById("modal"), large=document.getElementById("large"), detailName=document.getElementById("detailName"), detailMeta=document.getElementById("detailMeta"), detailText=document.getElementById("detailText"), flip=document.getElementById("flip");
let resolved=[], current=null, face=0;
function imgFor(c,i=0){
 const face=c.card_faces?.[i];
 const uris=face?.image_uris || c.image_uris || {};
 return uris.normal || uris.large || uris.png || uris.small || "";
}
function faces(c){return c.card_faces?.length>1 ? c.card_faces : null}
function identifiers(c){const id={name:c.name,set:c.set};if(c.collector)id.collector_number=c.collector;return id}
async function load(){
 const found=[],missing=[];
 for(let i=0;i<deck.length;i+=75){
  const batch=deck.slice(i,i+75);
  const response=await fetch("https://api.scryfall.com/cards/collection",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({identifiers:batch.map(identifiers)})});
  if(!response.ok)throw new Error("Scryfall returned HTTP "+response.status);
  const data=await response.json();found.push(...(data.data||[]));missing.push(...(data.not_found||[]));
 }
 const byKey=new Map(found.map(c=>[c.name.toLowerCase()+"|"+c.set,c]));
 resolved=deck.map(d=>{
   let c=byKey.get(d.name.toLowerCase()+"|"+d.set);
   if(!c)c=found.find(x=>x.name.toLowerCase()===d.name.toLowerCase());
   return c?{...c,qty:d.qty,deckName:d.name,deckSet:d.set,missing:false}:{name:d.name,qty:d.qty,deckSet:d.set,missing:true};
 });
 // Resolve double-faced cards by the front-face name. Scryfall's named
 // endpoint is unreliable when the combined "Front // Back" name is supplied.
 // Validate both face names instead of requiring a particular combined-name string.
 for(let i=0;i<resolved.length;i++){
  const d=deck[i];
  if(!d.name.includes(" // ")) continue;
  const [frontName,backName]=d.name.split(" // ").map(x=>x.trim());
  const valid=c=>{
   const f=c?.card_faces;
   return Array.isArray(f) && f.length>1 &&
    (f[0]?.name||"").toLowerCase()===frontName.toLowerCase() &&
    (f[1]?.name||"").toLowerCase()===backName.toLowerCase();
  };
  try{
   let c=null;
   // First ask Scryfall for the front face; this returns the complete
   // double-faced card object, including both faces' images and rules text.
   let url="https://api.scryfall.com/cards/named?fuzzy="+encodeURIComponent(frontName);
   let r=await fetch(url,{headers:{"Accept":"application/json"}});
   if(r.ok){const candidate=await r.json();if(valid(candidate))c=candidate;}
   // If fuzzy naming selected another printing/card, constrain by the deck's set.
   if(!c){
    const query='set:'+d.set+' name:"'+frontName+'"';
    url="https://api.scryfall.com/cards/search?q="+encodeURIComponent(query);
    r=await fetch(url,{headers:{"Accept":"application/json"}});
    if(r.ok){
     const results=await r.json();
     c=(results.data||[]).find(valid)||null;
    }
   }
   // Last fallback: search all sets for the exact front-face name.
   if(!c){
    const query='!"'+frontName+'"';
    url="https://api.scryfall.com/cards/search?q="+encodeURIComponent(query);
    r=await fetch(url,{headers:{"Accept":"application/json"}});
    if(r.ok){
     const results=await r.json();
     c=(results.data||[]).find(valid)||null;
    }
   }
   if(c)resolved[i]={...c,qty:d.qty,deckName:d.name,deckSet:d.set,missing:false};
  }catch(err){ /* Keep the entry marked missing if Scryfall cannot be reached. */ }
 }
 const unresolved=resolved.filter(c=>c.missing).length;
 notice.textContent=unresolved?`${unresolved} card lookup(s) still need attention. Double-faced cards receive an additional exact-name lookup.`:"All requested card entries were matched. Double-faced cards can be flipped to view both faces.";
 render();
}
function render(){
 const q=search.value.trim().toLowerCase();
 let list=resolved.filter(c=>c.name.toLowerCase().includes(q)||c.deckName.toLowerCase().includes(q));
 list.sort((a,b)=>a.name.localeCompare(b.name));
 stats.textContent=`${resolved.reduce((n,c)=>n+c.qty,0)} cards · ${resolved.length} distinct entries · ${resolved.filter(c=>!c.missing).length} matched printings`;
 grid.innerHTML="";
 for(const c of list){
  const el=document.createElement("article");el.className="card";
  const im=document.createElement("img");im.loading="lazy";im.alt=c.name;
  const src=imgFor(c);if(src)im.src=src;else{im.style.visibility="hidden";im.style.height="0"}
  const nm=document.createElement("div");nm.className="name";nm.textContent=c.name;
  const mt=document.createElement("div");mt.className="meta";mt.textContent=(c.qty>1?`×${c.qty} · `:"")+(c.missing?"Printing not matched":(c.set_name||c.deckSet));
  el.append(im,nm,mt);el.addEventListener("click",()=>openCard(c));grid.append(el);
 }
 if(!list.length)grid.innerHTML='<div class="notice">No cards match that search.</div>';
}
function openCard(c){
 current=c;face=0;const f=faces(c);large.src=imgFor(c,0);large.alt=c.card_faces?.[0]?.name||c.name;detailName.textContent=(c.card_faces?.[0]?.name||c.name)+(c.name===commander?" · COMMANDER":"");
 detailMeta.textContent=`${c.qty} ${c.qty===1?"copy":"copies"} · ${c.set_name||c.deckSet||""}${f?" · Front face":""}`;
 detailText.textContent=c.card_faces?.[0]?.oracle_text||c.oracle_text||"Card text is unavailable for this entry.";
 flip.hidden=!f;flip.textContent="Show other face";modal.showModal();
}
flip.addEventListener("click",()=>{if(!current)return;face=1-face;const f=current.card_faces?.[face];large.src=imgFor(current,face);large.alt=f?.name||current.name;detailName.textContent=f?.name||current.name;detailMeta.textContent=`${current.qty} ${current.qty===1?"copy":"copies"} · ${current.set_name||current.deckSet||""} · ${face===0?"Front face":"Back face"}`;detailText.textContent=f?.oracle_text||current.oracle_text||"Rules text is unavailable for this face.";flip.textContent=face===0?"Show other face":"Show front face"});
document.getElementById("close").addEventListener("click",()=>modal.close());
search.addEventListener("input",render);sort.addEventListener("change",render);
load().catch(e=>{stats.textContent="Could not load card data.";notice.textContent="Card lookup failed: "+e.message+". Check your connection and reload the page.";});
</script>
</body>
</html>
